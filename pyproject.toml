
####################
# Project Metadata #
####################
[project]
authors = [{ name = "Cody Fincher", email = "cody@litestar.dev" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Software Development",
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
]
dependencies = [
  "litestar>=2.19.0",
  "granian[all]>=2.7.9",
]
description = "Run Litestar applications with Granian while preserving Litestar startup, shutdown, logging, and server integrations."
keywords = ["litestar", "granian", "asgi", "asgi-server", "python", "web-server"]
license = { text = "MIT" }
name = "litestar-granian"
readme = "README.md"
requires-python = ">=3.10"
version = "0.16.0-beta.1"

[project.urls]
Changelog = "https://github.com/cofin/litestar-granian/blob/main/docs/changelog.rst"
Discord = "https://discord.gg/X3FJqy8d2j"
Documentation = "https://github.com/cofin/litestar-granian/tree/main/docs"
Issue = "https://github.com/cofin/litestar-granian/issues/"
Source = "https://github.com/cofin/litestar-granian"


[project.optional-dependencies]
rloop = ["granian[rloop]>=2.7.9"]
uvloop = ["granian[uvloop]>=2.7.9"]
winloop = ["granian[winloop]>=2.7.9"]

######################
# Build & Versioning #
######################
[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "setuptools"]

[tool.hatch.build.targets.sdist]
dev-mode-dirs = ["."]
exclude = ["/.agents", "/.beads", "/.geminiignore", "/.github", "/docs"]

[tool.hatch.metadata]
allow-direct-references = true

#####################
# Environment Setup #
#####################
[tool.uv]
default-groups = ["dev"]

# Test environment with test-only dependencies
[dependency-groups]
dev = [
  # - Release
  "bump-my-version",
  # - Documentation
  "sphinx>=7.1.2",
  "sphinx-autobuild>=2021.3.14",
  "sphinx-copybutton>=0.5.2",
  "sphinx-click>=5.0.1",
  "sphinx-design>=0.5.0",
  "shibuya",
  # - Linting
  "mypy",
  "ruff",
  "slotscheck",
  "pylint",
  "pyright",
  "pre-commit",
  "types-setuptools",
  "types-click",
  "types-decorator",
  "types-pyyaml",
  "types-docutils",
  "types-Pygments",
  "types-Pillow",
  "types-colorama",
  "types-pytz",
  # - Testing
  "structlog>=26.1.0",
  "anyio",
  "coverage[toml]",
  "pytest",
  "pytest-timeout",
  "pytest-cov",
  "pytest-mock",
  "pytest-sugar",
  "pytest-click",
  "pytest-xdist",
]
benchmark = [
  "httpx[http2]",
  "psutil",
  "websockets",
]

#####################
#    Testing        #
#####################
[tool.pytest.ini_options]
addopts = "-ra -q --doctest-glob='*.md'"
filterwarnings = [
  "ignore::DeprecationWarning:pkg_resources.*",
  "ignore::DeprecationWarning:xdist.*",
  "ignore::DeprecationWarning:importlib._bootstrap",
  "ignore::DeprecationWarning:litestar.handlers.http_handlers.decorators",
  "ignore::DeprecationWarning:multiprocessing.popen_fork",
]
markers = ["upstream: issue-linked diagnostics that do not satisfy plugin-owned acceptance criteria"]
testpaths = ["tests"]
timeout = 120
timeout_method = "thread"

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",

  # Don't complain about missing debug-only code:
  "def __repr__",
  "if self\\.debug",

  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",

  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  'class .*\bProtocol\):',
  '@(abc\.)?abstractmethod',
]


[tool.coverage.run]
branch = true
concurrency = ["multiprocessing"]
disable_warnings = ["no-data-collected", "module-not-measured", "module-not-imported"]
omit = ["litestar_granian/__metadata__.py", "tests/*", "tools/*"]
parallel = true
source = ["litestar_granian"]


#####################
# Tools             #
#####################

[tool.ruff]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  '__pycache__',
]
fix = true
include = ["litestar_granian/**/*.py", "litestar_granian/**/*.pyi", "tests/**/*.py", "tests/**/*.pyi","docs/**/*","examples/**/*"]
line-length = 120
lint.fixable = ["ALL"]
lint.ignore = [
  "empty-method-without-abstract-decorator",   # Allow non-abstract empty methods in abstract base classes
  "boolean-positional-value-in-call", # Allow boolean positional values in function calls, like `dict.get(... True)`
  # Ignore checks for possible passwords
  "hardcoded-password-string",
  "hardcoded-password-func-arg",
  "hardcoded-password-default",
  # Ignore complexity
  "complex-structure",
  "too-many-return-statements",
  "too-many-branches",
  "too-many-arguments",
  "too-many-statements",
  "compare-to-empty-string", # empty string comparisons
  "redefined-loop-name", # `for` loop variable overwritten
  "if-with-same-arms",  # Combine `if` branches using logical `or` operator
  "whitespace-before-punctuation",    # Whitespace before :, needed for black compatibility and also `ruff format`
  "single-line-implicit-string-concatenation",  # causes unexpected behaviour with formatter
  "line-too-long",    # pycodestyle line too long, handled by black
  "undocumented-public-module",    # pydocstyle - missing docstring in public module
  "undocumented-public-class",    # pydocstyle - missing docstring in public class
  "undocumented-public-method",    # pydocstyle - missing docstring in public method
  "undocumented-public-function",    # pydocstyle - missing docstring in public function
  "undocumented-public-package",    # pydocstyle - missing docstring in public package
  "undocumented-magic-method",    # pydocstyle - missing docstring in magic method
  "undocumented-public-nested-class",    # pydocstyle - missing docstring in public nested class
  "undocumented-public-init",    # pydocstyle - missing docstring in __init__
  "blank-line-after-function",    # pydocstyle - no blank lines allowed after function docstring
  "missing-blank-line-after-summary",    # pydocstyle - 1 blank line required between summary line and description
  "missing-terminal-punctuation",    # pydocstyle - first line should end with a period, question mark, or exclamation point
  "quoted-annotation",   # pyupgrade - removes quotes from type annotation
  "builtin-attribute-shadowing",    # flake8-builtins - class attribute {name} is shadowing a python builtin
  "set-attr-with-constant",    # flake8-bugbear - do not call setattr with a constant attribute value
  "function-call-in-default-argument",    #  flake8-bugbear - Do not perform function call `Parameter` in argument defaultsRuff(B008)
  "mutable-class-default",  # ruff - mutable class attributes should be annotated with `typing.ClassVar`
  "any-type",  # ruff - Dynamically typed expressions (typing.Any) are disallowed
  "too-many-arguments", # ruff - Too many arguments to function call
  "magic-value-comparison", # Magic value used in comparison
  "boolean-type-hint-positional-argument",  # Boolean typed positional argument in function definition
  "boolean-default-value-positional-argument",  # Boolean default positional argument in function definition
  "boolean-positional-value-in-call",  # Boolean Boolean default positional argument in function definition
  "unused-method-argument",  # Unused method argument
  "unused-function-argument",  # Unused function argument
  "missing-todo-author",
  "missing-todo-link",
  "line-contains-todo",
  "blanket-type-ignore",
  "asyncio-dangling-task",
  "unused-async",  # Ruff - Function is declared `async`, but doesn't `await` or use `async` features. # ignore
  "private-member-access",
  "pytest-parametrize-values-wrong-type",
  'subprocess-without-shell-equals-true',
  "line-too-long",    # pycodestyle line too long, handled by black
  "redefined-loop-name", # pylint - for loop variable overwritten by assignment target
  "any-type",
  "FBT",
  "too-many-arguments", # too many arguments
  "import-outside-top-level", # imports should be at the top-level of a file
  "PT",
  "TD",
  "try-except-in-loop", # ignore for now; investigate
  "missing-trailing-comma",
  "too-many-positional-arguments",
  "missing-copyright-notice",  # copywrite check
  "future-rewritable-type-annotation", # future annotations check
  "import-private-name",
]
lint.select = ["ALL"]
# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
preview = true                                                    # preview features & checks, use with caution
src = ["litestar_granian","tools","example", "tests/", "docs/"]
target-version = "py310"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["litestar_granian", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Allow print/pprint
"__init__.py" = ['unused-import', 'undocumented-public-package']
"__main__.py" = ["module-import-not-at-top-of-file"]
"docs/*" = ["suspicious-subprocess-import", "implicit-namespace-package","self-assigning-variable","builtin-variable-shadowing","commented-out-code","redefined-while-unused"]
"tools/*" = ["suspicious-subprocess-import"]
"examples/*" = ["print","docstring-missing-returns"]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = [
  "magic-value-comparison",
  "assert",
  "relative-imports",
  "commented-out-code",
  "missing-return-type-undocumented-public-function",
  "missing-type-function-argument",
  "undocumented-public-function",
  "undocumented-public-package",
  "print",
  "suspicious-subprocess-import",
  "no-self-use",
  "future-required-type-annotation",
  "hardcoded-bind-all-interfaces",
  "typing-only-standard-library-import",
  "docstring-missing-returns",
  "docstring-missing-yields",   # "Yields" section not required in test fixture docstrings
  "docstring-missing-exception",   # tests don't document raised exceptions
  "raise-vanilla-args",   # long exception messages in assert paths are useful for CI
  "raw-string-in-exception",    # exception message f-strings OK in tests
  "f-string-in-exception",    # exception message f-strings OK in tests
  "suppressible-exception",   # contextlib.suppress isn't always clearer in test teardown
  "literal-membership",  # set-literal-for-membership noise in small tuples
  "too-many-arguments",  # test fixtures/parametrize can grow arg lists
]


[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]

[tool.slotscheck]
strict-imports = false

[tool.mypy]
disallow_any_generics = false
disallow_untyped_decorators = true
implicit_reexport = false
show_error_codes = true
strict = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
packages = "litestar_granian,tests,docs"

[[tool.mypy.overrides]]
disable_error_code = "attr-defined"
disallow_untyped_decorators = false
module = "tests.*"

[tool.bumpversion]
allow_dirty = true
commit = false
commit_args = "--no-verify"
current_version = "0.16.0-beta.1"
ignore_missing_files = false
ignore_missing_version = false
message = "chore(release): bump to v{new_version}"
parse = """(?x)
    (?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)
    (-(?P<pre>alpha|beta|rc)\\.(?P<pre_n>\\d+))?
"""
regex = false
replace = "{new_version}"
search = "{current_version}"
serialize = ["{major}.{minor}.{patch}", "{major}.{minor}.{patch}-{pre}.{pre_n}"]
sign_tags = false
tag = false
tag_message = "chore(release): v{new_version}"
tag_name = "v{new_version}"

[tool.bumpversion.parts.pre]
first_value = "stable"
optional_value = "stable"
values = ["alpha", "beta", "rc", "stable"]

[tool.bumpversion.parts.pre_n]
first_value = "1"

# bump-my-version updates its TOML config file automatically. Registering
# pyproject.toml again would apply prerelease suffixes twice.
[[tool.bumpversion.files]]
filename = "uv.lock"
replace = """
name = "litestar-granian"
version = "{new_version}"
"""
search = """
name = "litestar-granian"
version = "{current_version}"
"""

[tool.codespell]
ignore-words-list = ["fo", "granian"]
skip = 'uv.lock'
