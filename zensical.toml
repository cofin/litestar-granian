[project]
site_name = "Litestar Granian"
site_description = "Run Litestar applications with Granian while preserving Litestar startup, shutdown, logging, and server integrations."
site_url = "https://cofin.github.io/litestar-granian/"
repo_url = "https://github.com/cofin/litestar-granian"
repo_name = "cofin/litestar-granian"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
exclude_docs = """
examples/**
"""
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Overview" = "getting-started/index.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
    { "Migration (v0.16)" = "migration/v0.16.md" },
    { "Contributing" = "contribution-guide.md" },
    { "Changelog" = "changelog.md" },
  ] },
  { "Guides" = [
    { "Overview" = "guides/index.md" },
    { "Configuration & Runtime" = "guides/configuration.md" },
    { "Logging & Metrics" = "guides/logging-and-metrics.md" },
    { "Static Files" = "guides/static-files.md" },
    { "Deployment & TLS" = "guides/deployment.md" },
  ] },
  { "Reference" = [
    { "Overview" = "reference/index.md" },
    { "Plugin API" = "reference/plugin.md" },
    { "CLI Reference" = "reference/cli.md" },
    { "Compatibility & Behaviour" = "reference/compatibility.md" },
  ] },
]

[project.theme]
variant = "modern"
language = "en"
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "indigo"
toggle = { icon = "lucide/sun", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "indigo"
toggle = { icon = "lucide/moon", name = "Switch to light mode" }

[project.extra]
generator = false
social = [
  { icon = "fontawesome/brands/github", link = "https://github.com/cofin/litestar-granian", name = "GitHub" },
  { icon = "fontawesome/brands/discord", link = "https://discord.gg/X3FJqy8d2j", name = "Discord" },
  { icon = "fontawesome/brands/python", link = "https://pypi.org/project/litestar-granian/", name = "PyPI" },
]

[project.plugins.redirects.redirect_maps]

[project.plugins.mkdocstrings]
default_handler = "python"
custom_templates = "tools/docs/templates"
enable_inventory = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://click.palletsprojects.com/en/stable/objects.inv",
  "https://docs.litestar.dev/latest/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
heading_level = 3
inherited_members = false
line_length = 80
members_order = "source"
merge_init_into_class = false
modernize_annotations = true
annotations_path = "brief"
preload_modules = ["litestar_granian"]
separate_signature = true
show_bases = true
show_category_heading = false
show_if_no_docstring = true
show_labels = false
show_object_full_path = false
show_overloads = false
show_root_full_path = false
show_root_heading = true
show_root_toc_entry = true
show_signature_annotations = false
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = false
signature_crossrefs = true
summary = { attributes = true, functions = false, classes = false, modules = false }
unwrap_annotated = true
filters = ["!^_"]

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true, toc_depth = "2-3" }

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
dedent_subsections = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
